name: Wotchi CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: wotchi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and release gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Queue saturation and response-path benchmark
        run: npm run benchmark:queue

      - name: Build and package checks
        run: |
          npm run verify:package
          npm run test:compat
          npm run benchmark

      - name: npm audit
        run: npm run security:audit

      - name: Secret scan
        uses: docker://zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 # v8.28.0
        with:
          args: detect --source=/github/workspace --no-banner --redact

  osv:
    name: OSV-Scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0
    permissions:
      actions: read
      contents: read
      security-events: write

  compatibility:
    name: Node.js ${{ matrix.node }} packed-tarball matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 22.x, 24.x, 26.x]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build packed package
        run: npm run build

      - name: Run packed-tarball compatibility matrix
        run: node scripts/run-compatibility-matrix.mjs --framework all --module both
